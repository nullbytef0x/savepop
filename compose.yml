services:
    api:
        build:
            context: .
            target: api
        init: true
        restart: unless-stopped
        environment:
            # Used internally when the API creates tunnel URLs. The frontend
            # rewrites those URLs to its same-origin /api proxy.
            API_URL: ${SAVEPOP_API_URL:-http://api:5120/}
            API_PORT: "5120"
            CORS_WILDCARD: "1"
            YOUTUBE_SESSION_SERVER: "http://yt-session-generator:8080/"
            YOUTUBE_SESSION_INNERTUBE_CLIENT: "WEB_EMBEDDED"
            # Local development smoke tests exercise every supported service.
            RATELIMIT_MAX: "500"
            TUNNEL_RATELIMIT_MAX: "500"
        depends_on:
            yt-session-generator:
                condition: service_healthy
        ports:
            - "5120:5120"

    yt-session-generator:
        image: ghcr.io/imputnet/yt-session-generator:webserver
        init: true
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/token', timeout=5)"]
            interval: 10s
            timeout: 10s
            retries: 60
            start_period: 20s

    web:
        build:
            context: .
            dockerfile: Dockerfile.web
            args:
                # Browsers reach the API through nginx, so remote visitors
                # never try to connect to localhost on their own computer.
                WEB_DEFAULT_API: ${SAVEPOP_WEB_API_URL:-/api/}
                WEB_HOST: ${WEB_HOST:-localhost:5173}
        init: true
        restart: unless-stopped
        depends_on:
            api:
                condition: service_started
        ports:
            - "5173:80"
