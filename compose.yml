services:
    api:
        build:
            context: .
            target: api
        init: true
        restart: unless-stopped
        environment:
            # Used internally when the API creates tunnel URLs. The frontend
            # rewrites those URLs to its same-origin /api proxy.
            API_URL: ${SAVEPOP_API_URL:-http://api:5120/}
            API_PORT: "5120"
            CORS_WILDCARD: "1"
            YOUTUBE_COOKIES_PATH: "/run/secrets/youtube-cookies.json"
            YOUTUBE_POT_PROVIDER_URL: "http://youtube-pot-provider:4416"
            # Local development smoke tests exercise every supported service.
            RATELIMIT_MAX: "500"
            TUNNEL_RATELIMIT_MAX: "500"
        depends_on:
            youtube-pot-provider:
                condition: service_healthy
        ports:
            - "5120:5120"
        volumes:
            - type: bind
              source: ./cookies.json
              target: /run/secrets/youtube-cookies.json
              read_only: true
              bind:
                  create_host_path: false

    youtube-pot-provider:
        image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
        init: true
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4416/ping').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 10s

    web:
        build:
            context: .
            dockerfile: Dockerfile.web
            args:
                # Browsers reach the API through nginx, so remote visitors
                # never try to connect to localhost on their own computer.
                WEB_DEFAULT_API: ${SAVEPOP_WEB_API_URL:-/api/}
                WEB_HOST: ${WEB_HOST:-localhost:5173}
        init: true
        restart: unless-stopped
        depends_on:
            api:
                condition: service_started
        ports:
            - "5173:80"
